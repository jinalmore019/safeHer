plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.safeher.sms'
version = '0.1.0'

android {
  namespace "com.safeher.sms"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10"
}
